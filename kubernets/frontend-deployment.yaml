apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: talal
  labels:
    app: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: frontend
          image: ghcr.io/saadatalal/frontend:v1
          imagePullPolicy: Always

          env:
            - name: API_URL
              value: "http://10.3.161.89:80"
            - name: BACKEND_URL
              value: "https://talal-kubernetes.infra-x.cloud"  

          ports:
            - containerPort: 80