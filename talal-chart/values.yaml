namespace: talal
backend:
  replicas: 2
  image:
    repository: ghcr.io/saadatalal/backend
    tag: v1
imagePullSecrets: ghcr-pull-secret
frontend:
  replicas: 1
  image:
    repository: ghcr.io/saadatalal/frontend
    tag: v1
  env:
    - name: API_URL
      value: "http://10.3.161.89:80"
    - name: BACKEND_URL
      value: "https://talal-kubernetes.infra-x.cloud"
grafana: 
  enabled: true


  ingress:
    enabled: true
    ingressClassName: nginx
    
    
    path: /
    pathType: Prefix

    hosts:
      - talal-grafana.infra-x.cloud
    ## Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
    extraPaths: []
    # - path: /*
    #   pathType: Prefix
    #   backend:
    #     service:
    #       name: ssl-redirect
    #       port:
    #         name: use-annotation


    tls: 
      - secretName: talal-grafana-tls
        hosts:
          - talal-grafana.infra-x.cloud  