services:
  mongodb:
    image: mongo:7.0.28
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: praxis
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/praxis", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./praxis
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/praxis
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_EXP_MINUTES: "120"
      ADMIN_DEFAULT_PASSWORD: "${ADMIN_DEFAULT_PASSWORD:?Set ADMIN_DEFAULT_PASSWORD in .env}"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./praxis-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    environment:
      API_URL: "http://localhost:8080"
    depends_on:
      - backend

volumes:
  mongo_data:
